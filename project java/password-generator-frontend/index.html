<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Password Generator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <h1>Password Generator</h1>
  <p class="subtitle">Generate secure passwords instantly</p>

  <!-- Password Display -->
  <div class="password-box">
    <input type="text" id="result" readonly placeholder="Your password will appear here">
    <button id="copyBtn">Copy</button>
  </div>

  <!-- Length Control -->
  <div class="option">
    <label>
      Password Length:
      <span id="lengthValue">12</span>
    </label>

    <input
      type="range"
      id="lengthSlider"
      min="4"
      max="32"
      value="12"
    >

    <input
      type="number"
      id="lengthInput"
      min="4"
      max="32"
      value="12"
    >
  </div>

  <!-- Character Options -->
  <div class="options">
    <label><input type="checkbox" id="lowercase" checked> Lowercase (a–z)</label>
    <label><input type="checkbox" id="uppercase" checked> Uppercase (A–Z)</label>
    <label><input type="checkbox" id="numbers" checked> Numbers (0–9)</label>
    <label><input type="checkbox" id="special"> Special Characters</label>
  </div>

  <!-- Custom Word -->
  <div class="option">
    <label>Custom Word (optional)</label>
    <input type="text" id="customWord" placeholder="example123">
  </div>

  <!-- Strength Indicator -->
  <div class="strength">
    <span>Password Strength</span>
    <div class="bar">
      <div id="strengthBar"></div>
    </div>
  </div>

  <!-- Generate Button -->
  <button class="generate-btn" id="generateBtn">
    Generate Password
  </button>
</div>

<script src="script.js"></script>
</body>
</html>
